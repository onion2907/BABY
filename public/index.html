<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>camera-watch</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>camera<span>-watch</span></h1>
  <div class="status" id="status" data-state="idle">
    <span class="dot"></span><span id="status-text">Checking Ollama…</span>
  </div>
  <button id="toggle" class="primary" disabled>Start watching</button>
</header>

<main>
  <section class="feed panel">
    <div class="video-wrap">
      <video id="video" autoplay playsinline muted></video>
      <div class="overlay" id="overlay">Camera off</div>
      <div class="badges">
        <span class="badge" id="badge-motion">—</span>
        <span class="badge" id="badge-latency">—</span>
      </div>
    </div>

    <div class="controls">
      <label>
        Vision model
        <select id="vision-model"></select>
      </label>
      <label>
        Summary model
        <select id="summary-model"></select>
      </label>
      <label>
        Look every
        <span class="row">
          <input type="range" id="interval" min="1" max="20" step="1" value="3">
          <output id="interval-out">3s</output>
        </span>
      </label>
      <label>
        Motion sensitivity
        <span class="row">
          <input type="range" id="threshold" min="0" max="12" step="0.5" value="2.5">
          <output id="threshold-out">2.5</output>
        </span>
        <small>Frames that differ from the last one you sent by less than this are
          skipped. 0 sends every frame.</small>
      </label>
      <label>
        Summarise every
        <span class="row">
          <input type="range" id="summary-every" min="2" max="20" step="1" value="6">
          <output id="summary-every-out">6 looks</output>
        </span>
      </label>
      <label>
        Frame width
        <span class="row">
          <input type="range" id="frame-width" min="256" max="896" step="64" value="512">
          <output id="frame-width-out">512px</output>
        </span>
        <small>Smaller is faster. Most local vision models see little extra above 640px.</small>
      </label>
      <details>
        <summary>Observation prompt</summary>
        <textarea id="observe-prompt" rows="7"></textarea>
      </details>
    </div>
  </section>

  <section class="readout">
    <div class="panel summary">
      <div class="panel-head">
        <h2>What's happening</h2>
        <span class="meta" id="summary-meta">no summary yet</span>
      </div>
      <div class="summary-body" id="summary">
        <p class="empty">Press <strong>Start watching</strong>. The first summary appears
          after a few looks at the scene.</p>
      </div>
    </div>

    <div class="panel log">
      <div class="panel-head">
        <h2>Observation log</h2>
        <span class="meta" id="log-meta">0 looks · 0 skipped</span>
      </div>
      <ol id="log"></ol>
    </div>
  </section>
</main>

<script src="app.js" type="module"></script>
</body>
</html>
