<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>camera-watch</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>camera<span>-watch</span></h1>
  <div class="status" id="status" data-state="idle">
    <span class="dot"></span><span id="status-text">Starting up…</span>
  </div>
  <button id="look-once" class="ghost" hidden>Look once</button>
  <button id="toggle" class="primary" disabled>Start watching</button>
</header>

<div class="banner" id="banner" hidden><span id="banner-text"></span></div>
<div class="nudges" id="nudges" hidden></div>

<main>
  <section class="feed panel">
    <div class="video-wrap">
      <video id="video" autoplay playsinline muted hidden></video>
      <img id="still" alt="The most recent picture from the camera" hidden>
      <div class="overlay" id="overlay">Camera off</div>
      <div class="badges">
        <span class="badge" id="badge-a">—</span>
        <span class="badge" id="badge-b">—</span>
      </div>
    </div>

    <details class="controls-wrap" id="settings-wrap">
      <summary>Camera and model settings</summary>
      <div class="controls">
        <label>
          Where the pictures come from
          <select id="source">
            <option value="webcam">This laptop's own camera (needs this page open)</option>
            <option value="snapshot">A home camera — still-picture address</option>
            <option value="rtsp">A home camera — video stream (needs ffmpeg)</option>
          </select>
        </label>

        <div class="camera-fields" id="camera-fields" hidden>
          <label id="field-snapshot">
            Still-picture address
            <input type="text" id="snapshotUrl" placeholder="http://192.168.1.50/snapshot.jpg" autocomplete="off">
          </label>
          <label id="field-rtsp">
            Video stream address
            <input type="text" id="rtspUrl" placeholder="rtsp://192.168.1.50:554/stream1" autocomplete="off">
          </label>
          <label>
            Camera username
            <input type="text" id="cameraUser" autocomplete="off">
          </label>
          <label>
            Camera password
            <input type="password" id="cameraPassword" autocomplete="new-password" placeholder="unchanged">
            <small>Saved on this computer only. It is never sent back to this page.</small>
          </label>
        </div>

        <label>
          Vision model <small id="vision-note"></small>
          <select id="visionModel"></select>
        </label>
        <label>
          Summary model
          <select id="summaryModel"></select>
        </label>
        <label>
          Look at the room every
          <span class="row">
            <input type="range" id="intervalSeconds" min="5" max="300" step="5" value="30">
            <output id="intervalSeconds-out">30s</output>
          </span>
        </label>
        <label>
          Write a summary every
          <span class="row">
            <input type="range" id="summaryEveryLooks" min="2" max="40" step="1" value="10">
            <output id="summaryEveryLooks-out">10 looks</output>
          </span>
        </label>
        <label>
          Nudge me if nobody is visible for
          <span class="row">
            <input type="range" id="nudgeOnNobodySeenMinutes" min="0" max="120" step="5" value="0">
            <output id="nudgeOnNobodySeenMinutes-out">off</output>
          </span>
          <small>Leave off until you have seen a day of real descriptions — otherwise
            it will nudge you constantly for no reason.</small>
        </label>
        <label>
          What to ask about each picture
          <textarea id="observePrompt" rows="3"></textarea>
          <small>Keep it to one short sentence. Small models answer with nothing
            when the question is long.</small>
        </label>
        <button id="save-settings" class="primary wide">Save settings</button>
      </div>
    </details>
  </section>

  <section class="readout">
    <div class="panel summary">
      <div class="panel-head">
        <h2>What's happening</h2>
        <span class="meta" id="summary-meta">no summary yet</span>
      </div>
      <div class="summary-body" id="summary">
        <p class="empty">Nothing recorded yet today.</p>
      </div>
    </div>

    <div class="panel log">
      <div class="panel-head">
        <h2>The diary</h2>
        <select id="day-picker" class="day-picker"></select>
        <span class="meta" id="log-meta">0 entries</span>
      </div>
      <ol id="log"></ol>
    </div>
  </section>
</main>

<footer>
  A written record, not a safety alarm. Keep a real baby monitor.
</footer>

<script src="app.js" type="module"></script>
</body>
</html>
